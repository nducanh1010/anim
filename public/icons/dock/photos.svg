<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="photosBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
    <filter id="pShadow" x="-2" y="-1" width="68" height="68" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#photosBg)" filter="url(#pShadow)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <!-- Apple Flower Petals with blend modes -->
  <g style="mix-blend-mode: multiply;" opacity="0.88">
    <!-- Top (Cyan) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" fill="#00D2FF"/>
    <!-- Top-Right (Blue) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(45 32 32)" fill="#3C72FF"/>
    <!-- Right (Magenta) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(90 32 32)" fill="#C83BFF"/>
    <!-- Bottom-Right (Red) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(135 32 32)" fill="#FF2D55"/>
    <!-- Bottom (Orange) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(180 32 32)" fill="#FF9500"/>
    <!-- Bottom-Left (Yellow) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(225 32 32)" fill="#FFCC00"/>
    <!-- Left (Lime) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(270 32 32)" fill="#7CD924"/>
    <!-- Top-Left (Teal) -->
    <ellipse cx="32" cy="20" rx="6" ry="11" transform="rotate(315 32 32)" fill="#34C759"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
</svg>

